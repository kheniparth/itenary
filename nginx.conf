server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;

    # Trip data API — proxied to the sidecar; never cache.
    location /api/ {
        proxy_pass http://banff-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # Service worker + manifest must never be cached long — they gate updates
    location = /service-worker.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # App JS/CSS — avoid stale Cloudflare/browser caches after deploy
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:jpg|jpeg|png|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
